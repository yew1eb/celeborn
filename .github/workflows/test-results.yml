# Aggregates surefire/junit XML reports uploaded by the "Celeborn CI" (maven) and
# "Celeborn SBT CI" (sbt) workflows into a per-PR Check run with pass/fail stats.
#
# Uses the workflow_run trigger (runs in the context of the default branch) so it
# can post results to PRs coming from forks, which a pull_request-triggered workflow
# cannot. The upstream workflows upload:
#   - surefire/test XML reports, via .github/actions/upload-test-reports
#   - an "Event File" artifact (github.event_path), via the event_file job
# The event file lets the publisher attribute results to the correct PR.

name: Test Results

on:
  workflow_run:
    workflows: ["Celeborn CI", "Celeborn SBT CI"]
    types:
      - completed

permissions: {}

jobs:
  test-results:
    name: Test Results
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'skipped'

    permissions:
      checks: write
      pull-requests: write
      actions: read

    steps:
      - name: Download and Extract Artifacts
        uses: dawidd6/action-download-artifact@246dbf436b23d7c49e21a7ab8204ca9ecd1fe615
        with:
          run_id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/Event File/event.json
          event_name: ${{ github.event.workflow_run.event }}
          check_name: "Test Results (${{ github.event.workflow_run.name }})"
          files: "artifacts/**/*.xml"
