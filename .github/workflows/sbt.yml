name: Celeborn SBT CI

on:
  push:
    branches:
      - main
      - branch-*
  pull_request:
    branches:
      - main
      - branch-*
    paths-ignore:
      # Pure documentation / metadata changes do not affect the build.
      - '**/*.md'
      - 'docs/**'
      - 'assets/diagram/**'
      - 'LICENSE'
      - 'NOTICE'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detects which top-level modules changed so that per-module test jobs can be skipped
  # when unrelated files are touched. See maven.yml for the same setup.
  changes:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.filter.outputs.service }}
      spark: ${{ steps.filter.outputs.spark }}
      flink: ${{ steps.filter.outputs.flink }}
      mr: ${{ steps.filter.outputs.mr }}
      common: ${{ steps.filter.outputs.common }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            service:
              - 'service/**'
            spark:
              - 'client-spark/**'
              - 'assets/spark-patch/**'
            flink:
              - 'client-flink/**'
            mr:
              - 'client-mr/**'
              - 'client-tez/**'
            common:
              - 'common/**'
              - 'spi/**'
              - 'build/**'
              - 'project/**'
              - '**/pom.xml'
              - '.mvn/**'
              - 'version.sbt'

  event_file:
    name: "Event File"
    runs-on: ubuntu-latest
    steps:
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Event File
          path: ${{ github.event_path }}

  service:
    needs: changes
    if: needs.changes.outputs.service == 'true' || needs.changes.outputs.common == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java:
          - 8
          - 11
          - 17
        scala:
          - '2.12.18'
          - '2.13.16'
    steps:
      - uses: ./.github/actions/setup-test
        with:
          java-version: ${{ matrix.java }}
          cache: sbt
      - name: Test Service with SBT
        run: |
          build/sbt ++${{ matrix.scala }} "clean; test"
      - uses: ./.github/actions/upload-test-reports
        if: always()
        with:
          artifact-name: service-java-${{ matrix.java }}-scala-${{ matrix.scala }}

  spark3:
    needs: changes
    if: needs.changes.outputs.spark == 'true' || needs.changes.outputs.common == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        spark:
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
          - '3.5'
        java:
          - 8
          - 11
          - 17
        scala-binary:
          - '2.12'
          - '2.13'
        shuffle-plugin-class:
          - 'org.apache.spark.shuffle.sort.io.LocalDiskShuffleDataIO'
          - 'org.apache.spark.shuffle.celeborn.CelebornShuffleDataIO'
        exclude:
          # SPARK-33772: Spark supports JDK 17 since 3.3.0
          - java: 17
            spark: '3.0'
          - java: 17
            spark: '3.1'
          - java: 17
            spark: '3.2'
          # Spark supports scala 2.13 since 3.2.0
          - scala-binary: '2.13'
            spark: '3.0'
          - scala-binary: '2.13'
            spark: '3.1'
          # ShuffleDriverComponents#supportsReliableStorage was introduced in 3.5.0
          - shuffle-plugin-class: 'org.apache.spark.shuffle.celeborn.CelebornShuffleDataIO'
            spark: '3.0'
          - shuffle-plugin-class: 'org.apache.spark.shuffle.celeborn.CelebornShuffleDataIO'
            spark: '3.1'
          - shuffle-plugin-class: 'org.apache.spark.shuffle.celeborn.CelebornShuffleDataIO'
            spark: '3.2'
          - shuffle-plugin-class: 'org.apache.spark.shuffle.celeborn.CelebornShuffleDataIO'
            spark: '3.3'
          - shuffle-plugin-class: 'org.apache.spark.shuffle.celeborn.CelebornShuffleDataIO'
            spark: '3.4'
        include:
          # Spark 3.0
          - spark: '3.0'
            scala-binary: '2.12'
            scala: '2.12.10'
          # Spark 3.1
          - spark: '3.1'
            scala-binary: '2.12'
            scala: '2.12.10'
          - spark: '3.1'
          # Spark 3.2
          - spark: '3.2'
            scala-binary: '2.12'
            scala: '2.12.15'
          - spark: '3.2'
            scala-binary: '2.13'
            scala: '2.13.5'
          # Spark 3.3
          - spark: '3.3'
            scala-binary: '2.12'
            scala: '2.12.15'
          - spark: '3.3'
            scala-binary: '2.13'
            scala: '2.13.8'
          # Spark 3.4
          - spark: '3.4'
            scala-binary: '2.12'
            scala: '2.12.17'
          - spark: '3.4'
            scala-binary: '2.13'
            scala: '2.13.8'
          # Spark 3.5
          - spark: '3.5'
            scala-binary: '2.12'
            scala: '2.12.18'
          - spark: '3.5'
            scala-binary: '2.13'
            scala: '2.13.8'
    steps:
      - uses: ./.github/actions/setup-test
        with:
          java-version: ${{ matrix.java }}
          cache: sbt
      - name: Test with SBT
        run: |
          build/sbt -Dspark.shuffle.plugin.class=${{ matrix.shuffle-plugin-class }} -Pspark-${{ matrix.spark }} ++${{ matrix.scala }} "clean; celeborn-spark-group/test"
      - uses: ./.github/actions/upload-test-reports
        if: always()
        with:
          artifact-name: spark-${{ matrix.spark }}-java-${{ matrix.java }}-scala-${{ matrix.scala }}

  spark4:
    needs: changes
    if: needs.changes.outputs.spark == 'true' || needs.changes.outputs.common == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        spark:
          - '4.0'
          - '4.1'
          - '4.2'
        java:
          - 17
        scala-binary:
          - '2.13'
        shuffle-plugin-class:
          - 'org.apache.spark.shuffle.celeborn.CelebornShuffleDataIO'
        include:
          - spark: '4.0'
            scala: '2.13.16'
          - spark: '4.1'
            scala: '2.13.17'
          - spark: '4.2'
            scala: '2.13.18'
    steps:
      - uses: ./.github/actions/setup-test
        with:
          java-version: ${{ matrix.java }}
          cache: sbt
      - name: Test with SBT
        run: |
          build/sbt -Dspark.shuffle.plugin.class=${{ matrix.shuffle-plugin-class }} -Pspark-${{ matrix.spark }} ++${{ matrix.scala }} "clean; celeborn-spark-group/test"
      - uses: ./.github/actions/upload-test-reports
        if: always()
        with:
          artifact-name: spark-${{ matrix.spark }}-java-${{ matrix.java }}-scala-${{ matrix.scala }}

  flink1:
    needs: changes
    if: needs.changes.outputs.flink == 'true' || needs.changes.outputs.common == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java:
          - 8
          - 11
        flink:
          - '1.18'
          - '1.19'
          - '1.20'
    steps:
      - uses: ./.github/actions/setup-test
        with:
          java-version: ${{ matrix.java }}
          cache: sbt
      - name: Test with SBT
        run: |
          build/sbt -Pflink-${{ matrix.flink }} "clean; celeborn-flink-group/test"
      - uses: ./.github/actions/upload-test-reports
        if: always()
        with:
          artifact-name: flink-${{ matrix.flink }}-java-${{ matrix.java }}

  flink2:
    needs: changes
    if: needs.changes.outputs.flink == 'true' || needs.changes.outputs.common == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java:
          - 11
          - 17
        flink:
          - '2.0'
          - '2.1'
          - '2.2'
          - '2.3'
    steps:
      - uses: ./.github/actions/setup-test
        with:
          java-version: ${{ matrix.java }}
          cache: sbt
      - name: Test with SBT
        run: |
          build/sbt -Pflink-${{ matrix.flink }} "clean; celeborn-flink-group/test"
      - uses: ./.github/actions/upload-test-reports
        if: always()
        with:
          artifact-name: flink-${{ matrix.flink }}-java-${{ matrix.java }}

  mr:
    needs: changes
    if: needs.changes.outputs.mr == 'true' || needs.changes.outputs.common == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java:
          - 8
          - 11
    steps:
      - uses: ./.github/actions/setup-test
        with:
          java-version: ${{ matrix.java }}
          cache: sbt
      - name: Test with SBT
        run: |
          build/sbt -Pmr "clean; celeborn-mr-group/test"
      - uses: ./.github/actions/upload-test-reports
        if: always()
        with:
          artifact-name: mr-java-${{ matrix.java }}

  openapi-codegen-check:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java:
          - 11
    steps:
      - uses: ./.github/actions/setup-test
        with:
          java-version: ${{ matrix.java }}
          cache: sbt
      - name: Test with SBT
        run: |
          build/sbt "clean;celeborn-openapi-client/check"
