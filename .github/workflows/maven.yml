# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Celeborn CI

on:
  push:
    branches:
      - main
      - branch-*
  pull_request:
    branches:
      - main
      - branch-*
    paths-ignore:
      # Pure documentation / metadata changes do not affect the build.
      - '**/*.md'
      - 'docs/**'
      - 'assets/diagram/**'
      - 'LICENSE'
      - 'NOTICE'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detects which top-level modules changed so that per-module test jobs can be skipped
  # when unrelated files are touched. The "common" group covers shared modules whose
  # changes can affect every consumer, so all jobs run when it is hit.
  changes:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.filter.outputs.service }}
      spark: ${{ steps.filter.outputs.spark }}
      flink: ${{ steps.filter.outputs.flink }}
      mr: ${{ steps.filter.outputs.mr }}
      common: ${{ steps.filter.outputs.common }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            service:
              - 'service/**'
            spark:
              - 'client-spark/**'
              - 'assets/spark-patch/**'
            flink:
              - 'client-flink/**'
            mr:
              - 'client-mr/**'
              - 'client-tez/**'
            common:
              - 'common/**'
              - 'spi/**'
              - 'build/**'
              - 'project/**'
              - '**/pom.xml'
              - '.mvn/**'
              - 'version.sbt'

  event_file:
    name: "Event File"
    runs-on: ubuntu-latest
    steps:
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Event File
          path: ${{ github.event_path }}

  service:
    needs: changes
    if: needs.changes.outputs.service == 'true' || needs.changes.outputs.common == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java:
          - 8
          - 11
          - 17
    steps:
      - uses: ./.github/actions/setup-test
        with:
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test Service with Maven
        run: build/mvn -Pgoogle-mirror test
      - uses: ./.github/actions/upload-test-reports
        if: always()
        with:
          artifact-name: service-java-${{ matrix.java }}
      - name: Upload coverage to Codecov
        if: matrix.java == 8
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false

  spark3:
    needs: changes
    if: needs.changes.outputs.spark == 'true' || needs.changes.outputs.common == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java:
          - 8
          - 11
          - 17
        spark:
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
          - '3.5'
        shuffle-plugin-class:
          - 'org.apache.spark.shuffle.sort.io.LocalDiskShuffleDataIO'
          - 'org.apache.spark.shuffle.celeborn.CelebornShuffleDataIO'
        exclude:
          # SPARK-33772: Spark supports JDK 17 since 3.3.0
          - java: 17
            spark: '3.0'
          - java: 17
            spark: '3.1'
          - java: 17
            spark: '3.2'
          # ShuffleDriverComponents#supportsReliableStorage was introduced in 3.5.0
          - shuffle-plugin-class: 'org.apache.spark.shuffle.celeborn.CelebornShuffleDataIO'
            spark: '3.0'
          - shuffle-plugin-class: 'org.apache.spark.shuffle.celeborn.CelebornShuffleDataIO'
            spark: '3.1'
          - shuffle-plugin-class: 'org.apache.spark.shuffle.celeborn.CelebornShuffleDataIO'
            spark: '3.2'
          - shuffle-plugin-class: 'org.apache.spark.shuffle.celeborn.CelebornShuffleDataIO'
            spark: '3.3'
          - shuffle-plugin-class: 'org.apache.spark.shuffle.celeborn.CelebornShuffleDataIO'
            spark: '3.4'
    steps:
      - uses: ./.github/actions/setup-test
        with:
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test with Maven
        run: |
          SPARK_BINARY_VERSION=${{ matrix.spark }}
          SPARK_MAJOR_VERSION=${SPARK_BINARY_VERSION%%.*}
          # enable AWS profile to run end-to-end tests with S3 storage
          PROFILES="-Pgoogle-mirror,aws,spark-${{ matrix.spark }}"
          TEST_MODULES="client-spark/common,client-spark/spark-${SPARK_MAJOR_VERSION},client-spark/spark-${SPARK_MAJOR_VERSION}-columnar-common,client-spark/spark-${SPARK_MAJOR_VERSION}-shaded,tests/spark-it"
          build/mvn $PROFILES -pl $TEST_MODULES -am clean install -DskipTests
          build/mvn $PROFILES -pl $TEST_MODULES -Dspark.shuffle.sort.io.plugin.class=${{ matrix.shuffle-plugin-class }} test
      - uses: ./.github/actions/upload-test-reports
        if: always()
        with:
          artifact-name: spark-${{ matrix.spark }}-java-${{ matrix.java }}

  spark4:
    needs: changes
    if: needs.changes.outputs.spark == 'true' || needs.changes.outputs.common == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java:
          - 17
        spark:
          - '4.0'
          - '4.1'
          - '4.2'
        shuffle-plugin-class:
          - 'org.apache.spark.shuffle.celeborn.CelebornShuffleDataIO'
    steps:
      - uses: ./.github/actions/setup-test
        with:
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test with Maven
        run: |
          SPARK_BINARY_VERSION=${{ matrix.spark }}
          SPARK_MAJOR_VERSION=${SPARK_BINARY_VERSION%%.*}
          # enable AWS profile to run end-to-end tests with S3 storage
          PROFILES="-Pgoogle-mirror,aws,spark-${{ matrix.spark }}"
          TEST_MODULES="client-spark/common,client-spark/spark-3,client-spark/spark-3-columnar-common,client-spark/spark-${SPARK_MAJOR_VERSION}-shaded,tests/spark-it"
          build/mvn $PROFILES -pl $TEST_MODULES -am clean install -DskipTests
          build/mvn $PROFILES -pl $TEST_MODULES -Dspark.shuffle.sort.io.plugin.class=${{ matrix.shuffle-plugin-class }} test
      - uses: ./.github/actions/upload-test-reports
        if: always()
        with:
          artifact-name: spark-${{ matrix.spark }}-java-${{ matrix.java }}

  flink1:
    needs: changes
    if: needs.changes.outputs.flink == 'true' || needs.changes.outputs.common == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java:
          - 8
          - 11
        flink:
          - '1.18'
          - '1.19'
          - '1.20'
    steps:
      - uses: ./.github/actions/setup-test
        with:
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test with Maven
        run: |
          PROFILES="-Pgoogle-mirror,flink-${{ matrix.flink }}"
          TEST_MODULES="client-flink/common,client-flink/flink-${{ matrix.flink }},client-flink/flink-${{ matrix.flink }}-shaded,tests/flink-it"
          build/mvn $PROFILES -pl $TEST_MODULES -am clean install -DskipTests
          build/mvn $PROFILES -pl $TEST_MODULES test
      - uses: ./.github/actions/upload-test-reports
        if: always()
        with:
          artifact-name: flink-${{ matrix.flink }}-java-${{ matrix.java }}

  flink2:
    needs: changes
    if: needs.changes.outputs.flink == 'true' || needs.changes.outputs.common == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java:
          - 11
          - 17
        flink:
          - '2.0'
          - '2.1'
          - '2.2'
          - '2.3'
    steps:
      - uses: ./.github/actions/setup-test
        with:
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test with Maven
        run: |
          PROFILES="-Pgoogle-mirror,flink-${{ matrix.flink }}"
          TEST_MODULES="client-flink/common,client-flink/flink-${{ matrix.flink }},client-flink/flink-${{ matrix.flink }}-shaded,tests/flink-it"
          build/mvn $PROFILES -pl $TEST_MODULES -am clean install -DskipTests
          build/mvn $PROFILES -pl $TEST_MODULES test
      - uses: ./.github/actions/upload-test-reports
        if: always()
        with:
          artifact-name: flink-${{ matrix.flink }}-java-${{ matrix.java }}

  mr:
    needs: changes
    if: needs.changes.outputs.mr == 'true' || needs.changes.outputs.common == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java:
          - 8
          - 11
    steps:
      - uses: ./.github/actions/setup-test
        with:
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test with Maven
        run: |
          PROFILES="-Pgoogle-mirror,mr"
          TEST_MODULES="client-mr/mr,client-mr/mr-shaded,tests/mr-it"
          build/mvn $PROFILES -pl $TEST_MODULES -am clean install -DskipTests
          build/mvn $PROFILES -pl $TEST_MODULES test
      - uses: ./.github/actions/upload-test-reports
        if: always()
        with:
          artifact-name: mr-java-${{ matrix.java }}
