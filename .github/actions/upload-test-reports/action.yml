name: Upload test reports
description: >
  Always upload surefire/junit XML reports (consumed by test-results.yml to publish per-PR test summaries)
  and, on failure, upload the full test logs. Shared by maven.yml / sbt.yml jobs.

inputs:
  artifact-name:
    description: Base name for the uploaded artifacts (a `-log` suffix is appended for failure logs).
    required: true

runs:
  using: composite
  steps:
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          **/target/surefire-reports/**/*.xml
          **/target/test-reports/**/*.xml
        if-no-files-found: ignore
      continue-on-error: true
    - name: Upload test log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}-log
        path: |
          **/target/test-reports/**
          **/target/unit-tests.log
        if-no-files-found: ignore
      continue-on-error: true
