name: Setup test environment
description: Checkout the project and set up JDK with optional build-tool cache. Shared by maven.yml / sbt.yml jobs.

inputs:
  java-version:
    description: JDK version to set up.
    required: true
  cache:
    description: Build tool to cache, e.g. 'maven' or 'sbt'. Empty string disables caching.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Checkout project
      uses: actions/checkout@v4
    - name: Setup JDK ${{ inputs.java-version }}
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: ${{ inputs.java-version }}
        cache: ${{ inputs.cache }}
        check-latest: false
